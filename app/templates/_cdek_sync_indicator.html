<div class="product-site-sync-control cdek-sync-control" data-cdek-sync data-sync-state="{{ 'attention' if cdek_summary.problems else 'success' }}" data-url="{{ url_for('cdek_sales_sync_status') }}" data-csrf="{{ csrf_token() }}">
  <button type="button" class="button button-secondary product-site-sync-indicator" data-cdek-toggle aria-expanded="false" aria-haspopup="dialog" aria-controls="cdekSyncPanel"><span class="product-site-sync-indicator__dot" aria-hidden="true"></span><span data-cdek-label>Сверка СДЭК · {{ cdek_summary.problems }} проблем</span><span aria-hidden="true">⌄</span></button>
  <section id="cdekSyncPanel" class="product-site-sync-panel" role="dialog" aria-modal="false" aria-labelledby="cdekSyncTitle" hidden>
    <header class="product-site-sync-panel__header"><strong id="cdekSyncTitle">Сверка СДЭК</strong><div class="product-site-sync-panel__actions"><a class="product-site-sync-update cdek-all-shipments" href="{{ url_for('cdek_sales_page', mode='all', back=request.full_path) }}">Все отправления →</a><button type="button" class="product-site-sync-update" data-cdek-run>↻ Обновить</button></div></header>
    <div class="product-site-sync-panel__source"><span class="product-site-sync-source-dot" aria-hidden="true"></span><strong>СДЭК</strong><span class="product-site-sync-source-state" data-cdek-state aria-live="polite">Загрузка состояния…</span><time class="product-site-sync-source-time" data-cdek-attempt>—</time><button type="button" class="product-site-sync-source-refresh" data-cdek-refresh aria-label="Обновить данные панели">↻</button><span class="product-site-sync-source-detail"><a class="product-site-sync-issue-link" href="{{ cdek_audit_url }}"><strong data-cdek-problems>{{ cdek_summary.problems }}</strong> проблемных отправлений →</a></span></div>
    <div class="cdek-sync-feedback" data-cdek-feedback role="status"></div>
    <footer class="product-site-sync-panel__footer"><span>Автоматически раз в час</span><span data-cdek-success>Последняя успешная: —</span></footer>
  </section>
</div>
